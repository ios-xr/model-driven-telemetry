syntax = "proto3";

package cisco_ios_xr_mfwd_fretta_oper.ipv6_mfwd_fretta.nodes.node.databases.database.route_table_filters.route_table_filter.route;

message ipv4_mfwd_fretta_route_bag_KEYS {
	string node_name = 1;
	string database_name = 2;
	string sub_cmd = 3;
	bool is_shadow = 4;
	bool is_detail = 5;
	bool show_internal = 6;
	bool af_specific_flags = 7;
	string source_address = 8;
	string group_address = 9;
	uint32 prefix_length = 10;
}

message ipv4_mfwd_fretta_route_ext_bag {
	uint32 vrf_id = 1;
	uint32 routeid = 2;
	sint32 pri_mcid = 3;
	sint32 bkup_mcid = 4;
	uint32 trans_id = 5;
}

message ipv4_mfwd_fretta_ing_route_ext_bag {
	uint32 route_fgid = 1;
	bool rpf_if_signal = 2;
	uint32 encap_rpf_id = 3;
	bool local_rcvr = 4;
	bool encap_id_flag = 5;
	sint32 encap_id = 6;
	bool punt = 7;
	bool punt_if_fwd = 8;
	uint32 punt_action = 9;
	uint32 tun_rif = 10;
	uint32 tun_lif = 11;
	bool stats_enabled = 12;
}

message ipv4_mfwd_fretta_eg_route_ext_bag {
	uint32 rpf_id = 1;
}

message dnx_mcast_bvi_msg_info_st_ {
	uint32 shm_entry_id = 1;
	uint32 trans_id = 2;
	uint32 ole_cnt = 3;
}

message ipv4_mfwd_fretta_olist_detail_bag {
	uint32 npu_id = 1;
	uint32 o_intf = 2;
	uint32 o_port = 3;
	uint32 ole_type = 4;
	uint32 ul_ifh = 5;
	uint32 is_bundle = 6;
	uint32 is_local = 7;
	uint32 bundle_ifhandle = 8;
	uint32 mem_ifhandle = 9;
	uint32 member_sysport = 10;
	bool is_bvi = 11;
	uint32 bd_id = 12;
	uint32 rif = 13;
	uint32 bvi_shm_entry_id = 14;
	repeated dnx_mcast_bvi_msg_info_st_ irb_nfn_msg = 15;
	uint32 trans_id = 16;
}

message ipv4_mfwd_fretta_dpa_olist_detail_bag {
	uint32 bundle_ifhandle = 1;
	uint32 mem_ifhandle = 2;
	uint32 parent_ifhandle = 3;
	uint32 bvi_ifhandle = 4;
	uint32 member_sysport = 5;
	uint32 is_local = 6;
	uint32 ole_type = 7;
	uint32 npu_id = 8;
	string o_intf = 9;
	bool is_bd_recycle_lif_ole = 10;
	uint32 bd_recycle_lif = 11;
	uint32 o_port = 12;
	string cud = 13;
	bool is_bundle = 14;
	bool efp_visibiity = 15;
	uint32 sys_port = 16;
	uint64 mpls_encap_id = 17;
	bool is_pw_access = 18;
	uint32 pw_encap_id = 19;
	uint64 lag_id = 20;
	uint64 l3intf_refhdl = 21;
	uint64 l3intf_refkey = 22;
	uint64 l2port_refhandl = 23;
	uint64 l2port_refkey = 24;
	uint64 mplsnh_refhandl = 25;
	uint64 mplsnh_refkey = 26;
	uint64 lagport_refhndl = 27;
	uint64 lagport_refkey = 28;
	uint64 packets = 29;
	uint64 bytes = 30;
}

message ipv4_mfwd_fretta_route_ing_dnx_ext_bag {
	bool local_route = 1;
	bool in_hw = 2;
	bool is_accept_intf_bvi = 3;
	bool is_tun_rif_set = 4;
	uint32 ipmc_fec_id = 5;
	uint32 encap_id = 6;
	uint32 tun_rif_vrf_id = 7;
	uint32 tun_rif_rpf_id = 8;
	uint32 tun_rif = 9;
	uint32 tun_lif = 10;
}

message ipv4_mfwd_fretta_route_eg_dnx_ext_bag {
	string bvi_count = 1;
}

message ipv4_mfwd_fretta_route_dir_bag {
	uint32 rc = 1;
	sint32 ts = 2;
}

message ipv4_mfwd_fretta_dnx_dpa_route_bag {
	uint64 dpa_route_hdl = 1;
	uint32 dpa_route_trans_id = 2;
	uint32 npu_id = 3;
	sint32 ipmc_vrf = 4;
	bool use_merged = 5;
	sint32 a_intf = 6;
	sint32 a_intf_id = 7;
	uint32 a_tun_rif = 8;
	uint32 a_tun_lif = 9;
	uint32 fgid = 10;
	uint32 ipmc_fec_id = 11;
	uint32 ipmc_punt_action = 12;
	uint32 tcam_entry_id = 13;
	uint32 ipmc_action = 14;
	uint64 l3intf_refhdl = 15;
	uint64 l3intf_refkey = 16;
	uint32 ipmc_fec_accessed = 17;
	bool stats_enabled = 18;
	bool stats_activated = 19;
}

message ipv4_mfwd_fretta_route_ing_npu_res_ext_bag {
	uint32 status1 = 1;
	uint32 status2 = 2;
	uint32 npu_id = 3;
	uint32 vrf_id = 4;
	string source = 5;
	string group = 6;
	uint32 result = 7;
	uint32 fec_id = 8;
	uint32 rpf_id = 9;
	uint32 mcid = 10;
	uint32 comp_result = 11;
	uint32 comp_id = 12;
}

message ipv4_mfwd_fretta_route_egr_npu_res_ext_repl_bag {
	sint32 gport = 1;
	sint32 cud1 = 2;
	sint32 cud2 = 3;
}

message ipv4_mfwd_fretta_route_egr_npu_res_ext_bag {
	uint32 npu_id = 1;
	uint32 status = 2;
	repeated ipv4_mfwd_fretta_route_egr_npu_res_ext_repl_bag repl_bag = 3;
}

message ipv4_mfwd_fretta_route_bag {
	bool internal = 50;
	bool internal_detail = 51;
	uint32 vrf = 52;
	uint32 npu_id = 53;
	uint32 npu_mask = 54;
	uint64 dpa_olist_hdl = 55;
	uint32 dpa_olist_trans_id = 56;
	string source = 57;
	string src_pfx_len = 58;
	string group = 59;
	string grp_pfx_len = 60;
	uint32 flags = 61;
	uint32 a_intf = 62;
	uint32 a_intf_id = 63;
	uint32 fgid = 64;
	uint32 ipmc_fec_id = 65;
	uint32 olist_count = 66;
	uint32 olist_fgid = 67;
	uint32 error = 68;
	ipv4_mfwd_fretta_route_ext_bag route_ext = 69;
	ipv4_mfwd_fretta_ing_route_ext_bag ing_route_ext = 70;
	ipv4_mfwd_fretta_eg_route_ext_bag eg_route_ext = 71;
	repeated ipv4_mfwd_fretta_olist_detail_bag ing_bdl = 72;
	repeated ipv4_mfwd_fretta_dpa_olist_detail_bag dpa_ing_bdl = 73;
	ipv4_mfwd_fretta_route_ing_dnx_ext_bag dnx_ing_ext = 74;
	ipv4_mfwd_fretta_route_eg_dnx_ext_bag dnx_eg_ext = 75;
	ipv4_mfwd_fretta_route_dir_bag eg = 76;
	ipv4_mfwd_fretta_route_dir_bag ing = 77;
	ipv4_mfwd_fretta_dnx_dpa_route_bag dpa_route = 78;
	repeated ipv4_mfwd_fretta_olist_detail_bag ole = 79;
	repeated ipv4_mfwd_fretta_dpa_olist_detail_bag dpa_ole = 80;
	repeated ipv4_mfwd_fretta_route_ing_npu_res_ext_bag ing_route_res_ext_bag = 81;
	repeated ipv4_mfwd_fretta_route_egr_npu_res_ext_bag egr_route_res_ext_bag = 82;
	uint32 rc_val = 83;
}

